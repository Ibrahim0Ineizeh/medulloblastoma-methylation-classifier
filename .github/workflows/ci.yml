name: Quality checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Run portable synthetic demonstration
        run: mb-classifier demo --output /tmp/mb-demo
      - name: Execute project walkthrough
        run: >-
          python -m jupyter nbconvert --to notebook --execute
          --output /tmp/mb-walkthrough.ipynb
          --ExecutePreprocessor.timeout=180
          notebooks/reproduce_pipeline.ipynb
      - uses: actions/upload-artifact@v4
        with:
          name: demonstration-python-${{ matrix.python-version }}
          path: /tmp/mb-demo/
