[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medulloblastoma-methylation-classifier"
version = "1.0.0"
description = "An auditable NMF and SVM benchmark for eight medulloblastoma molecular subtypes"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ibrahim Ineizeh"}]
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2", "matplotlib>=3.8,<4", "pyarrow>=15,<26",
  "joblib>=1.3,<2", "threadpoolctl>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "nbformat>=5.10", "nbconvert>=7.16", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
mb-classifier = "mb_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "Assessment 1", "Assessment 2", "reports", "tmp",
  "notebooks/medulloblastoma_study.ipynb",  # Preserved original research record.
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/mb_classifier/reporting.py" = ["E501"]  # Embedded HTML and CSS strings.
